version: 2
updates:
  # Keep GitHub Actions versions current (we use actions/checkout, actions/setup-node, etc.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 3
    labels: ['dependencies', 'github-actions']
    commit-message:
      prefix: ci

  # Keep npm dependencies current. lufs-web is currently zero-dep (deps + devDeps
  # both empty) — so this section is a no-op today but activates the moment we
  # add any dependency, no second config commit needed.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels: ['dependencies', 'npm']
    commit-message:
      prefix: chore(deps)
    # Group all minor + patch updates into a single weekly PR to reduce noise.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types: [patch, minor]
